pattern-not
Ищет неправильное действие в той же самой строке.
Пример:
«Найди все вызовы eval(X), кроме eval("1 + 1")».

Ты смотришь прямо на саму команду eval и бракуешь конкретную строку.




pattern-not-inside
Проверяет забор (контекст) вокруг строки. Ему важна не только сама строка, а где именно она лежит.
Пример:
«Найди опасное присвоение target[key] = val, ЕСЛИ ОНО НЕ СТОИТ ВНУТРИ защитного проверки if (key !== '__proto__') { ... }».

Код присвоения сам по себе одинаковый, но если он обёрнут в if, сканер его прощает.


- pattern: $TARGET[$KEY] = $VALUE
- pattern-not-inside: |
    if ($KEY === '__proto__') {
      ...
    }





Блок №1: Конструктор правил (Основные блоки YAML)
В YAML-файле Semgrep каждое правило состоит из нескольких обязательных и опциональных полей:

rules:
  - id: UNIQUE_RULE_NAME              # 1. Паспортный ID правила (латиница, дефисы/подчеркивания)
    patterns:                         # 2. Логический блок условий (AND)
      - pattern: ...                  # Что ищем
      - pattern-not: ...              # Какую именно строку исключаем
      - pattern-not-inside: |         # Внутри какого блока кода НЕ триггериться
          ...
    message: "Описание ошибки"        # 3. Текст тикета для разработчика
    languages: [javascript, typescript] # 4. Языки программирования
    severity: ERROR                   # 5. Критичность (ERROR, WARNING, INFO)




Блок №2: 3 Главных Символа (Синтаксис AST)
Semgrep ищет не текст, а синтаксис. Тебе нужно знать всего 3 элемента:
Метапеременная ($VAR):
Обязательно ЗАГЛАВНЫМИ БУКВАМИ.
Совпадает с любой переменной, функцией или выражением.
Пример: func($X) совпадет и с func(a), и с func(req.body.user).
Оператор Ellipsis (...):
Означает «любое количество аргументов, параметров или строк кода».
Пример: app.post(...) найдет любой POST-эндпоинт с любыми аргументами.
Многострочный оператор YAML (|):
Ставится после pattern:, pattern-not-inside: или message:, если твой код или текст занимает больше одной строки.


Запиши в шпаргалку полезные команды CLI
# 1. Запустить свое правило на файле
semgrep --config=my-rule.yaml server.js

# 2. Запустить официальную бесплатную базу правил Semgrep для Node.js/Express
semgrep --config=p/nodejs server.js

# 3. Быстрая проверка валидности YAML (без сканирования)
semgrep --config=my-rule.yaml --validate




Semgrep Registry — это официальный бесплатный репозиторий правил, созданный разработчиками Semgrep (компанией r2c) и AppSec-сообществом.
Когда ты запускаешь команду semgrep --config=p/nodejs, сканер скачивает готовый набор проверенных правил из облака и за секунды проверяет твой проект.
Что содержит база p/nodejs и p/express:
В неё уже зашиты сотни готовых правил под Node.js, которые ищут самые частые уязвимости (CWE и OWASP Top 10):
Injection уязвимости:
Command Injection в child_process (exec, execSync).
SQL Injection в популярной ORM и драйверах (pg, mysql2, sequelize, knex).
NoSQL Injection в MongoDB / Mongoose ($where, передача сырых объектов в find()).
Опасные настройки сервера:
CORS Misconfiguration (например, res.header("Access-Control-Allow-Origin", "*") с куками).
Disabled CSRF / Helmet (отключенные базовые средства защиты Express).
Hardcoded Secrets (утечка JWT-секретов, ключей API или паролей к БД прямо в коде).
Специфичные фичи Node.js:
Prototype Pollution (поиск уязвимых версий lodash, lodash.merge, defaultsDeep).
Path Traversal в fs.readFile или при отдаче статики (express.static).
ReDoS (регулярки, приводящие к 100% загрузке CPU сервера).
Insecure Deserialization (использование node-serialize или serialize-javascript).


Кастомные правила (Custom Rules) → ищут специфичный код, внутренние библиотеки и уникальную бизнес-логику твоей компании.

Публичные правила (Registry p/nodejs) → ищут изъяны в популярных сторонних npm-пакетах и стандартных конфигурациях Express/SQL.



Почему p/nodejs показал 0 findings:
Стандартные публичные правила заточены под популярные npm-пакеты и стандартные методы Express.

Зачем нужны кастомные правила:
Кастомный SAST нужен, чтобы ловить уязвимости в самописном коде (кастомный merge, утилиты CLI, внутренние вызовы child_process).
